spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

security:
  jwt:
    secret: test-secret-key-with-at-least-thirty-two-bytes
    expiration: 1h
  users:
    - username: admin
      password: "{noop}admin123"
      role: ADMIN
    - username: user
      password: "{noop}user123"
      role: USER
